name: Deploy Node.js Backend

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v0.1.8
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ubuntu
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 22
          script: |
            # Navigate to the directory
            mkdir -p /home/ubuntu/research-and-development-backend
            cd /home/ubuntu/research-and-development-backend

            # Use SSH-based Git clone/pull (replace with your repo URL)
            if [ ! -d .git ]; then
              git clone git@github.com:hashanus54/research-and-development-backend.git .
            else
              git pull origin main
            fi

            # Install dependencies and restart PM2
            npm install
            pm2 reload 0  # Graceful restart
